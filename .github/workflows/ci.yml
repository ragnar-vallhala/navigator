# Navigator (Qt6 GCS) build, its ctest cases, and the clang-tidy gate over the
# same database.
#
# SITL is OFF here, and that is a gap rather than a decision. The in-app
# simulator needs the firmware's SITL SDK (vayu-sitl-sdk.tar.gz: the engine
# module, the headless binary, four headers), which this repository does not
# build and no firmware release publishes yet. So CI currently proves the GCS
# builds and its 20 cases pass, but does NOT compile SimWorker, SitlModule or
# SimulatorWidget.
#
# To close it once the firmware repo publishes a release, unpack the tarball at
# the repo root before configuring and drop the NAVIGATOR_SITL=OFF:
#
#   - run: |
#       gh release download --repo <firmware-repo> -p 'vayu-sitl-sdk*.tar.gz'
#       tar xzf vayu-sitl-sdk*.tar.gz
#
# CMake finds vayu-sitl-sdk/include by itself from there.
#
# Slowest job here at ~14 min, nearly all of it Qt6 + assimp apt install and a
# cold compile. Caching those is the real win and is not attempted yet.

name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '**/docs/**'

jobs:
  navigator:
    name: ci (Qt6 build + tests + clang-tidy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Qt6 + assimp
        run: |
          sudo apt-get update
          # libpulse-dev is optional to the build (find_library, degrades
          # gracefully) but is installed so CI compiles the same audio path a
          # developer machine does, rather than a variant nobody runs.
          sudo apt-get install -y cmake clang-tidy-18 jq \
            qt6-base-dev qt6-base-dev-tools qt6-serialport-dev \
            libgl1-mesa-dev libassimp-dev libpulse-dev python3-numpy
      - name: Configure + build
        # Grass/flora is off by default, which leaves GpuGrass.cpp in no
        # database at all; on here so the analysis below sees it.
        run: |
          cmake -S navigator -B navigator/build-tidy \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNAVIGATOR_SIM_GRASS=ON \
                -DNAVIGATOR_SITL=OFF
          cmake --build navigator/build-tidy -j"$(nproc)"
          # The headless mesh tool is the one source neither job's main
          # database reaches; it needs the same Qt6 + assimp already installed
          # here, and a configure is enough.
          cmake -S navigator/headless-sdk/cpp/worldmesh \
                -B navigator/headless-sdk/cpp/worldmesh/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: ctest
        # 20 QtTest cases. Several construct widgets and so need a platform
        # plugin; offscreen is what the headless render test documents.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir navigator/build-tidy --output-on-failure
      - name: clang-tidy (Navigator)
        # AUTOMOC generates the tst_*.moc the tests include, so this needs a
        # real build, not just a configure. The closing "not analysed" list
        # names what no database here covers -- with SITL off that includes the
        # simulator sources, which is the same gap the header describes.
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          tools/dev/run_clang_tidy.sh \
            navigator/build-tidy navigator/headless-sdk/cpp/worldmesh/build
