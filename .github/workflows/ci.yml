# Navigator (Qt6 GCS) build, its ctest cases, and the clang-tidy gate over the
# same database.
#
# SITL is ON, against a firmware release rather than firmware source: nothing
# here compiles a line of it. The SDK tarball is fetched from a PINNED version
# release of the vayu repo and unpacked at the repo root, which is where CMake
# looks by default. The pin lives in VAYU_FW_VERSION on the fetch step.
#
# A release asset and not an Actions artifact: artifacts need a same-repo
# token, so this workflow could not read one from another repository.
#
# vayu is private, so the release asset is no longer anonymous either: this
# workflow's own GITHUB_TOKEN cannot read another private repository. The fetch
# authenticates with the VAYU_RELEASE_TOKEN secret, a fine-grained token with
# read-only Contents access to ragnar-vallhala/vayu and nothing else. Pull
# requests from forks get no secrets, so for them the fetch fails with a message
# saying so rather than a bare 404.
#
# The GCS and the firmware therefore version independently, which is the point
# of shipping them separately. A mismatch is still caught at load rather than
# misread: if a bumped pin brings an incompatible VAYU_SITL_ABI_VERSION, the
# module refuses to load and the SITL cases fail loudly.
#
# The Qt6 build is shared by three parallel jobs (build + ctest, the Xvfb GL
# tests, clang-tidy), each building navigator/build-tidy under ccache; see the
# comment on the `navigator` job for why that, and not an artifact hand-off.

name: ci

# Required checks report on every PR, docs-only ones included: a required
# check that never reports blocks the merge forever, which is what
# `paths-ignore` would do here. Docs-only changes are instead detected by the
# `changes` job, and the build jobs skip -- which `CI required` accepts only when `changes` said so.
on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # A new branch or a force push has no usable base: build.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD \
                   | grep -qvE '(\.md$|^docs/|/docs/)' && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/dev/lint_commits.sh "origin/${{ github.base_ref }}..HEAD"

  # The Qt6 build and the ctest cases. clang-tidy and the xcb/Xvfb GL tests
  # are their own jobs below and run in parallel with this one. Each of the
  # three builds navigator/build-tidy on its own runner through the qt-build
  # local action, with ccache: the alternative, one build job handing its tree
  # to the others as an artifact, would make the 5 min GL job wait for the
  # build and move a multi-hundred-MB tree through artifact storage twice, to
  # save compile time ccache already saves. The cost of this layout is three
  # apt installs (~1 min each) and a cold-cache first run that compiles three
  # times in parallel.
  navigator:
    name: Qt6 build + ctest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/qt-build
        with:
          vayu-token: ${{ secrets.VAYU_RELEASE_TOKEN }}
          extra-packages: python3-numpy python3-pytest
      - name: Headless SDK unit tests (wire drift vs vsim_proto.h)
        # navigator/headless-sdk hand-mirrors the vsim wire layer in Python.
        # tests/unit/test_wire_drift.py parses the static_assert sizes out of
        # the SDK's vsim_proto.h and fails if the Python struct sizes differ,
        # so a protocol change in the firmware turns CI red here instead of
        # corrupting frames at runtime. The header comes from the SDK fetched
        # above (the version this repo is pinned to), not from a checkout.
        # The test skips itself when the header is missing, so the header must
        # exist and the run must show no skips: a skip here would mean the
        # drift guard silently checked nothing.
        env:
          VSIM_PROTO_H: ${{ github.workspace }}/vayu-sitl-sdk/include/vsim_proto.h
        run: |
          set -euo pipefail
          test -f "$VSIM_PROTO_H" || { echo "::error::$VSIM_PROTO_H missing"; exit 1; }
          # The headless package imports the NavLink Python codec from
          # navlink/generated/python, which is generated, not checked in.
          python3 navlink/generate.py --lang py --out navlink/generated
          cd navigator/headless-sdk
          log="$RUNNER_TEMP/headless-unit.log"
          PYTHONPATH=. python3 -m pytest tests/unit -q -rs -p no:cacheprovider \
            2>&1 | tee "$log"
          if grep -qE '[0-9]+ skipped' "$log"; then
            echo "::error::headless unit tests skipped; the drift guard did not run"
            exit 1
          fi
      - name: ctest
        # 20 QtTest cases. Several construct widgets and so need a platform
        # plugin; offscreen is what the headless render test documents. The
        # module is put beside the test binaries so anything that loads the
        # engine finds it on the first search path.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cp vayu-sitl-sdk/lib/libvayu_sitl.so navigator/build-tidy/
          ctest --test-dir navigator/build-tidy --output-on-failure
      - name: Skipped ctest cases (summary)
        # ctest counts a QtTest SKIP as Passed, so "Passed" above can mean "ran
        # nothing". Print which cases skipped (from the full per-test log ctest
        # keeps) so that is visible in this log. Informational: it never fails
        # the job -- the xcb steps in the `gl` job are what enforce 0 skipped
        # for the cases that can run here. (The tests that self-skip on offscreen
        # either run under xcb below, or skip because the engine is absent.)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          log=navigator/build-tidy/Testing/Temporary/LastTest.log
          if [ ! -f "$log" ]; then echo "no $log (ctest did not run)"; exit 0; fi
          awk '
            /^[0-9]+\/[0-9]+ Testing: / { t = $3 }
            /^[A-Za-z_0-9]+ *: .*SKIP|^SKIP   : / { n[t]++; tot++ }
            END {
              for (k in n) printf "  %-32s %d skipped\n", k, n[k]
              printf "ctest skip summary: %d skipped QtTest case(s) in %d test binary(ies) (ctest reported them all Passed)\n", tot, length(n)
            }' "$log"
      - name: Backtrace for crashed ctest cases
        # ctest only says 'SegFault'. Re-run each failed case under gdb so a
        # crash shows where. Diagnostic only: the ctest step above already
        # failed the job, this step never changes the outcome.
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo timeout -k 10 300 apt-get -o DPkg::Lock::Timeout=120 install -y gdb \
            || { echo "gdb not installed"; exit 0; }
          for t in $(ctest --test-dir navigator/build-tidy --rerun-failed -N \
                       | sed -n 's/.*Test *#[0-9]*: //p'); do
            exe=$(find navigator/build-tidy -name "$t" -type f -perm -u+x | head -1)
            [ -n "$exe" ] || continue
            echo "::group::gdb $t"
            timeout 300 gdb -batch -ex run -ex bt -ex 'thread apply all bt 12' "$exe" 2>&1 | tail -80 || true
            echo "::endgroup::"
          done

  # The xcb-on-Xvfb tests: the cases ctest can only report as Passed having
  # skipped (it forces the offscreen platform). Own job so the 5-6 min
  # tst_world_change_floor runs beside the build/ctest and clang-tidy jobs
  # instead of after them.
  gl:
    name: Xvfb GL tests (xcb, software GL)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: ./.github/actions/qt-build
        with:
          vayu-token: ${{ secrets.VAYU_RELEASE_TOKEN }}
      - name: Engine module beside the test binaries
        # What the ctest step in the navigator job does before it runs; the
        # tests below also get the module path through VAYU_SITL_MODULE, this
        # keeps the first-search-path lookup identical to there.
        run: cp vayu-sitl-sdk/lib/libvayu_sitl.so navigator/build-tidy/
      - name: GL context test (xcb on Xvfb, software GL)
        # tst_sim_gl_context needs a real GL platform and skips itself on
        # offscreen, which is what the ctest step above forces on every case --
        # so there ctest only ever reports it Passed having run nothing. Run it
        # here directly: xcb on a virtual X server with GLX, Mesa llvmpipe. It
        # needs only the SDK headers (compile time), not the engine module.
        # A failing binary fails the step; a skip would exit 0, so the totals
        # line is also required to show passes and no skips.
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          t=navigator/build-tidy/tests/tst_sim_gl_context
          test -x "$t" || { echo "$t was not built"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" "$t" 2>&1 \
            | tee gl-context.log
          grep -qE '^Totals: [1-9][0-9]* passed, 0 failed, 0 skipped' gl-context.log \
            || { echo "::error::tst_sim_gl_context did not pass cleanly (skipped or no passes)"; exit 1; }
      - name: tst_world_change_floor (xcb on Xvfb, software GL, real engine)
        # The test skips under the offscreen platform ctest forces (it owns GL
        # views) and its Running cases also skip without the engine module, so
        # the ctest step above only ever reports it Passed having run nothing.
        # This job is the one with the engine module (copied beside the test
        # binaries above), so it is run here: each test function in its own
        # process under its own timeout + xvfb-run (as tst_workspace_gl does:
        # one hang must not eat the others), with a private engine VFS dir,
        # FIFO suffix and settings per case. A QtTest skip exits 0, so a case
        # whose Totals line does not show "0 failed, 0 skipped" FAILS the step, and the
        # number of cases is required to be at least 3.
        # Software GL on a shared runner is slow: the Running case is
        # wall-clock paced (about a minute on a laptop), hence the 240 s cap.
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          build=${BUILD_DIR:-navigator/build-tidy}
          module=${ENGINE_MODULE:-$PWD/vayu-sitl-sdk/lib/libvayu_sitl.so}
          bin=$build/tests/tst_world_change_floor
          # A minimum, not an exact number: cases get added to the test (the
          # list itself comes from the binary), but one cannot silently vanish.
          expect_min=3
          test -x "$bin" || { echo "$bin was not built"; exit 1; }
          test -f "$module" || { echo "engine module $module missing"; exit 1; }
          failed=0
          # A crash must show where: keep core files and print a backtrace for
          # a case that dies on a signal (after all assertions passed, a crash
          # at exit gives no other hint). Diagnostic only; the exit code is
          # still what fails the step.
          sudo timeout -k 10 300 apt-get -o DPkg::Lock::Timeout=120 install -y gdb \
            || echo "gdb not installed: crashes will have no backtrace"
          sudo rm -f /tmp/core-* || true
          sudo sysctl -w kernel.core_pattern='/tmp/core-%e.%p' || true
          ulimit -c unlimited
          # The case list comes from the binary (offscreen only to list them).
          fns=$(QT_QPA_PLATFORM=offscreen "$bin" -functions | sed 's/()$//' \
                  | grep -v -E '^(initTestCase|cleanupTestCase|.*_data)$')
          n=$(echo "$fns" | grep -c .)
          echo "tst_world_change_floor: $n cases: $(echo $fns)"
          if [ "$n" -lt "$expect_min" ]; then
            echo "RESULT: expected at least $expect_min cases, found $n"; exit 1
          fi
          # Functions whose data rows are each slow get one process (and one
          # 240 s budget) per row: 12 far-from-origin rows take about 225 s
          # together on a runner (4-14 s of world change per row), so they
          # cannot share one cap. The row names come from the binary too.
          split_rows="farFromOriginStreamsAndCollides"
          cases=()
          for f in $fns; do
            case " $split_rows " in
              *" $f "*)
                nrows=0
                while IFS= read -r line; do
                  cases+=("$f:${line#* $f }")
                  nrows=$((nrows + 1))
                done < <(QT_QPA_PLATFORM=offscreen "$bin" -datatags \
                           | grep -E "^[A-Za-z0-9_]+ $f ")
                if [ "$nrows" -lt 1 ]; then
                  echo "RESULT: no data rows found for $f"; exit 1
                fi ;;
              *) cases+=("$f") ;;
            esac
          done
          echo "tst_world_change_floor: ${#cases[@]} runs"
          i=0
          for fn in "${cases[@]}"; do
            i=$((i + 1))
            echo "::group::tst_world_change_floor $fn"
            start=$SECONDS
            rc=0
            log=$(mktemp)
            priv=$(mktemp -d)
            VAYU_VFS_DIR="$priv/vfs" VSIM_FIFO_SUFFIX="ci$$_$i" \
              VAYU_SITL_MODULE="$module" XDG_CONFIG_HOME="$priv/cfg" \
              XDG_DATA_HOME="$priv/data" \
              timeout -k 10 240 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              "$bin" "$fn" -v2 >"$log" 2>&1 || rc=$?
            # (not `| tee`: under pipefail the `|| true` that follows would
            # replace the exit status with true's, hiding a failing case)
            cat "$log"
            secs=$((SECONDS - start))
            echo "::endgroup::"
            case $rc in
              0) res=PASS ;;
              124|137) res=TIMEOUT; failed=1 ;;
              *) res="FAIL(rc=$rc)"; failed=1 ;;
            esac
            if [ "$rc" -gt 128 ] && [ "$rc" -ne 137 ] && command -v gdb >/dev/null; then
              core=$(ls -t /tmp/core-* 2>/dev/null | head -1 || true)
              if [ -n "$core" ]; then
                echo "::group::backtrace of $fn (rc=$rc, $core)"
                sudo chmod a+r "$core" || true
                gdb -batch -ex bt -ex "info threads" -ex "thread apply all bt" \
                    "$bin" "$core" 2>&1 | tail -150 || true
                echo "::endgroup::"
                sudo rm -f /tmp/core-* || true
              else
                echo "no core file found for $fn (rc=$rc)"
              fi
            fi
            # A QtTest skip exits 0 and looks like a pass: require 0 skipped.
            totals=$(grep -E '^Totals:' "$log" | tail -1 || true)
            if [ "$res" = PASS ]; then
              case "$totals" in
                *" 0 failed, 0 skipped"*) ;;
                *) res="FAILED-SKIPPED-OR-NO-TOTALS"; failed=1 ;;
              esac
            fi
            echo "RESULT $fn: $res (${secs}s) ${totals:-}"
          done
          exit $failed
      - name: Widget/GL tests that skip on offscreen (xcb on Xvfb, software GL)
        # ctest pins QT_QPA_PLATFORM=offscreen on every case (navigator_test()),
        # so each test below self-skips there and ctest still says Passed. Run
        # them here on a real platform: xcb on a virtual X server, Mesa
        # llvmpipe. One binary (or one named test function) per process, each
        # under its own timeout, so a hang cannot eat the job (tst_workspace_gl
        # hung once on a runner and is deliberately NOT in this list: it has its
        # own per-function step in the workspace job). A QtTest skip exits 0, so
        # every Totals line must show passes and "0 failed, 0 skipped".
        # Entry format: test[:function[:nomodule]]. "nomodule" points the engine
        # module at a missing file for that run (tst_sim_runlog has one case
        # that only runs without the engine and one that only runs with it, so
        # no single run can have 0 skipped).
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          build=navigator/build-tidy/tests
          module=$PWD/vayu-sitl-sdk/lib/libvayu_sitl.so
          entries="tst_native_clip tst_workspace_manager tst_gpu_grass
                   tst_sim_runlog:missingModuleLeavesNoLogs:nomodule
                   tst_sim_runlog:rapidStartStopOneRunPerStart"
          failed=0
          i=0
          for e in $entries; do
            i=$((i + 1))
            IFS=: read -r name fn mode <<<"$e"
            bin=$build/$name
            test -x "$bin" || { echo "$bin was not built"; failed=1; continue; }
            mod=$module
            [ "$mode" = nomodule ] && mod=$PWD/no-such-engine-module.so
            echo "::group::$name ${fn:-}"
            log=$(mktemp)
            priv=$(mktemp -d)
            rc=0
            start=$SECONDS
            VAYU_VFS_DIR="$priv/vfs" VSIM_FIFO_SUFFIX="xcb$$_$i" \
              VAYU_SITL_MODULE="$mod" XDG_CONFIG_HOME="$priv/cfg" \
              XDG_DATA_HOME="$priv/data" \
              timeout -k 10 120 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              "$bin" ${fn:+"$fn"} -v2 >"$log" 2>&1 || rc=$?
            cat "$log"
            secs=$((SECONDS - start))
            echo "::endgroup::"
            totals=$(grep -E '^Totals:' "$log" | tail -1 || true)
            res=PASS
            case $rc in
              0) ;;
              124|137) res=TIMEOUT ;;
              *) res="FAIL(rc=$rc)" ;;
            esac
            if [ "$res" = PASS ] && ! echo "$totals" | grep -qE '^Totals: [1-9][0-9]* passed, 0 failed, 0 skipped'; then
              res="SKIPPED-OR-NO-PASSES"
            fi
            [ "$res" = PASS ] || { failed=1; echo "::error::$name ${fn:-} $res"; }
            echo "RESULT $name${fn:+::$fn}: $res (${secs}s) ${totals:-no totals line}"
          done
          exit $failed

  # clang-tidy over the same database. On a pull request only the files the PR
  # touches (plus the sources that include a touched header), see
  # tools/dev/tidy_changed_files.sh; on a push to main or stable the full pass
  # runs, which is what catches whatever the partial one cannot see.
  tidy:
    name: clang-tidy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: ./.github/actions/qt-build
        with:
          vayu-token: ${{ secrets.VAYU_RELEASE_TOKEN }}
          extra-packages: clang-tidy-18 jq
      - name: Configure the headless mesh tool database
        # The headless mesh tool is the one source the main database does not
        # reach; it needs the same Qt6 + assimp already installed here, and a
        # configure is enough.
        run: |
          cmake -S navigator/headless-sdk/cpp/worldmesh \
                -B navigator/headless-sdk/cpp/worldmesh/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Choose the files to analyse
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != pull_request ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "full pass: not a pull request"; exit 0
          fi
          list="$(tools/dev/tidy_changed_files.sh "$BASE" HEAD)"
          if [ "$list" = FULL ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "full pass: the change touches build or analysis configuration"; exit 0
          fi
          printf '%s\n' "$list" | grep . > "$RUNNER_TEMP/tidy-files.txt" || : > "$RUNNER_TEMP/tidy-files.txt"
          echo "mode=partial" >> "$GITHUB_OUTPUT"
          echo "partial pass over $(wc -l < "$RUNNER_TEMP/tidy-files.txt") file(s):"
          cat "$RUNNER_TEMP/tidy-files.txt"
      - name: clang-tidy (Navigator)
        # AUTOMOC generates the tst_*.moc the tests include, so this needs a
        # real build, not just a configure (done by qt-build above). With SITL
        # on, the database covers the simulator sources too -- SimWorker,
        # SitlModule, SimulatorWidget.
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          if [ "${{ steps.scope.outputs.mode }}" = partial ]; then
            export TIDY_FILES="$RUNNER_TEMP/tidy-files.txt"
          fi
          tools/dev/run_clang_tidy.sh \
            navigator/build-tidy navigator/headless-sdk/cpp/worldmesh/build

  # The workspace/docking mock (navigator/tools/workspace_mock) and its tests.
  # Own job and own build directory so a problem here cannot turn the main
  # build/clang-tidy job red, and so it needs neither the firmware SDK nor the
  # secret behind it (SITL is off): it runs on fork PRs too.
  #
  # Qt Advanced Docking System is fetched at configure time from a PINNED
  # commit (NAVIGATOR_FETCH_ADS) and built here as a shared library; it needs
  # the Qt private headers, hence qt6-base-private-dev.
  workspace:
    name: Workspace mock + tests (Qt Advanced Docking, Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Qt6 + private headers + Xvfb
        uses: ./.github/actions/apt-install
        with:
          cache-id: workspace
          packages: >-
            cmake ninja-build python3-numpy
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools
            qt6-serialport-dev libgl1-mesa-dev libassimp-dev libpulse-dev
            xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-icccm4
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
            libxcb-xkb1
      - name: Configure + build the mock and its tests
        run: |
          cmake -S navigator -B navigator/build-ws -G Ninja \
                -DNAVIGATOR_SITL=OFF -DNAVIGATOR_FETCH_ADS=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build navigator/build-ws -j"$(nproc)" \
                --target workspace_mock tst_workspace_manager tst_workspace_gl
      - name: tst_workspace_manager (no GL, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir navigator/build-ws --output-on-failure -R tst_workspace_manager
      - name: tst_workspace_manager backtrace (only when it failed)
        # The runner's Qt (6.x, newer than a developer machine's) can crash
        # where the local one does not; print where, instead of just SEGFAULT.
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex bt -ex "info threads" \
              --args navigator/build-ws/tests/tst_workspace_manager || true
      - name: tst_workspace_gl (xcb on Xvfb, software GL)
        # The GL test needs a real platform plugin and skips itself under
        # offscreen. It is run as a binary, not through ctest: navigator_test()
        # pins QT_QPA_PLATFORM=offscreen on every ctest case (so this step's
        # xcb was overridden and the test only ever skipped), and ctest hides
        # a QtTest skip as a pass. Run directly, the log shows PASS or SKIP.
        # It was green on two separate GitHub runs (both cases PASS), so a
        # failure or a timeout in any case now fails the job.
        # Run directly (no ctest TIMEOUT), the first run on a runner hung for
        # 30+ minutes, and the next one hung one case for 145 s. Each test
        # function is its own process under its own timeout and xvfb-run, so one
        # hang cannot eat the others. (QTEST_FUNCTION_TIMEOUT is no help: its
        # watchdog calls qFatal and aborts the whole process, so it would end
        # the remaining functions too.) 4 cases x 100 s max < timeout-minutes.
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          bin=navigator/build-ws/tests/tst_workspace_gl
          failed=0
          # The case list comes from the binary, so a new case cannot be left
          # out of CI by forgetting to add it here (the list used to be fixed
          # and two newer cases never ran).
          fns=$(QT_QPA_PLATFORM=offscreen "$bin" -functions | sed 's/()$//')
          n=$(echo "$fns" | grep -c .)
          echo "tst_workspace_gl: $n cases: $(echo $fns)"
          if [ "$n" -lt 4 ]; then
            echo "RESULT: expected at least 4 cases, found $n"; exit 1
          fi
          for fn in $fns; do
            echo "::group::tst_workspace_gl $fn"
            start=$SECONDS
            rc=0
            log=$(mktemp)
            timeout -k 10 100 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              "$bin" "$fn" -v2 >"$log" 2>&1 || rc=$?
            cat "$log"
            secs=$((SECONDS - start))
            echo "::endgroup::"
            case $rc in
              0) res=PASS ;;
              124|137) res=TIMEOUT; failed=1 ;;
              *) res="FAIL(rc=$rc)"; failed=1 ;;
            esac
            # A QtTest skip exits 0 and looks like a pass: require 0 skipped.
            if [ "$res" = PASS ]; then
              totals=$(grep -E '^Totals:' "$log" | tail -1 || true)
              case "$totals" in
                *" 0 failed, 0 skipped"*) ;;
                *) res="FAILED-SKIPPED-OR-NO-TOTALS ($totals)"; failed=1 ;;
              esac
            fi
            echo "RESULT $fn: $res (${secs}s) ${totals:-}"
          done
          exit $failed

  # The GCS-only Windows build (NAVIGATOR_SITL=OFF: the SITL bridge needs a
  # POSIX host) on MSYS2 UCRT64, the toolchain tools/windows/deploy-navigator-
  # msys.sh bundles from. It keeps the Windows port from rotting between
  # releases; the SITL tabs are compiled out here, everything else is in.
  windows:
    name: Windows build + tests (MSYS2 UCRT64, GCS-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-serialport
            git
      - name: Configure + build
        run: |
          cmake -S navigator -B build-win -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DNAVIGATOR_SITL=OFF
          cmake --build build-win -j"$(nproc)"
      - name: ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-win --output-on-failure
      - name: Water cache thread cases, 200 runs
        # tst_waterfield's thread case hung once for 300 s on this job (11 green
        # runs before it). The cause is a hypothesis (the winpthreads rwlock
        # behind std::shared_mutex, now a plain mutex), not proven. The cases
        # take ~0.1 s each, so 200 runs cost seconds here, and a regression or a
        # remaining hang shows up with a log instead of once in a dozen runs.
        if: ${{ !cancelled() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          exe=$(find build-win -name tst_waterfield.exe | head -1)
          [ -n "$exe" ] || { echo "no tst_waterfield.exe (the build failed?)"; exit 0; }
          for i in $(seq 200); do
            rc=0
            timeout 60 "$exe" bodyCacheGivesTheSameHeightsOnAnyThread \
                bodyCacheSurvivesEightThreadsAndFieldChurn > water-loop.txt 2>&1 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "run $i of 200 failed, exit=$rc"
              tail -60 water-loop.txt
              exit 1
            fi
          done
          echo "200 runs clean"
      - name: Workspace mock + tests (Qt Advanced Docking)
        # Qt Advanced Docking System is fetched (pinned commit) and built here.
        # Never tried on MSYS2 UCRT64 by the author: it is allowed to fail
        # until someone has seen it pass, and does not gate the check.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S navigator -B build-win-ws -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DNAVIGATOR_SITL=OFF \
                -DNAVIGATOR_FETCH_ADS=ON
          cmake --build build-win-ws -j"$(nproc)" \
                --target workspace_mock tst_workspace_manager
          ctest --test-dir build-win-ws --output-on-failure -R tst_workspace_manager
      - name: Failing tests, run directly
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # ctest swallowed the QtTest output of a failing test on Windows;
          # run each failed test's exe on its own to see why.
          for t in $(ctest --test-dir build-win --rerun-failed -N | sed -n 's/.*Test *#[0-9]*: //p'); do
            exe=$(find build-win -name "$t.exe" | head -1)
            echo "=== $t ($exe)"
            rc=0
            "$exe" -v2 -o "$t.out.txt,txt" > "$t.stdout.txt" 2>&1 || rc=$?
            echo "exit=$rc"
            cat "$t.out.txt" "$t.stdout.txt" 2>&1 | tail -80
          done

  # The one check branch protection requires. Every job in `needs` must have
  # ended acceptably; a cancelled, failed or timed-out job fails it, and so
  # does a skip nobody intended. "Skipped" is accepted in exactly two places:
  #   - commit-lint, which only runs on pull requests (skipped on a push);
  #   - the five build jobs, only when `changes` succeeded AND reported
  #     code=false (a docs-only change). With code=true they must all be
  #     `success`: a build job that is skipped then, because something it
  #     needed failed or the run was cancelled, blocks.
  # `changes` itself must be `success` always. Its output is empty if it did
  # not run, which matches neither 'true' nor 'false' and so also blocks.
  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, commit-lint, navigator, gl, tidy, workspace, windows]
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
          R_CHANGES: ${{ needs.changes.result }}
          R_LINT: ${{ needs.commit-lint.result }}
          R_NAVIGATOR: ${{ needs.navigator.result }}
          R_GL: ${{ needs.gl.result }}
          R_TIDY: ${{ needs.tidy.result }}
          R_WORKSPACE: ${{ needs.workspace.result }}
          R_WINDOWS: ${{ needs.windows.result }}
        run: |
          fail=0
          check() { # name result skip-is-ok(yes|no)
            if [ "$2" = success ] || { [ "$2" = skipped ] && [ "$3" = yes ]; }; then
              echo "ok      $1: $2"
            else
              echo "BLOCKED $1: $2"; fail=1
            fi
          }
          echo "event=$EVENT code=$CODE"
          check changes "$R_CHANGES" no
          # skipped is intended off pull requests only
          if [ "$EVENT" = pull_request ]; then lint_skip=no; else lint_skip=yes; fi
          check commit-lint "$R_LINT" "$lint_skip"
          # skipped is intended only for a docs-only change
          if [ "$R_CHANGES" = success ] && [ "$CODE" = false ]; then
            build_skip=yes
          else
            build_skip=no
          fi
          check navigator "$R_NAVIGATOR" "$build_skip"
          check gl "$R_GL" "$build_skip"
          check tidy "$R_TIDY" "$build_skip"
          check workspace "$R_WORKSPACE" "$build_skip"
          check windows "$R_WINDOWS" "$build_skip"
          exit $fail
