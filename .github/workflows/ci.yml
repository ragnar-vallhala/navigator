# Navigator (Qt6 GCS) build, its ctest cases, and the clang-tidy gate over the
# same database.
#
# SITL is ON, against a firmware release rather than firmware source: nothing
# here compiles a line of it. The SDK tarball is fetched from a PINNED version
# release of the vayu repo and unpacked at the repo root, which is where CMake
# looks by default. The pin lives in VAYU_FW_VERSION on the fetch step.
#
# A release asset and not an Actions artifact: artifacts need a same-repo
# token, so this workflow could not read one from another repository.
#
# vayu is private, so the release asset is no longer anonymous either: this
# workflow's own GITHUB_TOKEN cannot read another private repository. The fetch
# authenticates with the VAYU_RELEASE_TOKEN secret, a fine-grained token with
# read-only Contents access to ragnar-vallhala/vayu and nothing else. Pull
# requests from forks get no secrets, so for them the fetch fails with a message
# saying so rather than a bare 404.
#
# The GCS and the firmware therefore version independently, which is the point
# of shipping them separately. A mismatch is still caught at load rather than
# misread: if a bumped pin brings an incompatible VAYU_SITL_ABI_VERSION, the
# module refuses to load and the SITL cases fail loudly.
#
# Slowest job here at ~14 min, nearly all of it Qt6 + assimp apt install and a
# cold compile. Caching those is the real win and is not attempted yet.

name: ci

# Required checks report on every PR, docs-only ones included: a required
# check that never reports blocks the merge forever, which is what
# `paths-ignore` would do here. Docs-only changes are instead detected by the
# `changes` job, and the build jobs skip -- which `CI required` counts as ok.
on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -eu
          # A new branch or a force push has no usable base: build.
          if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          code=$(git diff --name-only "$BASE" HEAD \
                   | grep -qvE '(\.md$|^docs/|/docs/)' && echo true || echo false)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"

  commit-lint:
    name: Commit message lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: tools/dev/lint_commits.sh "origin/${{ github.base_ref }}..HEAD"

  navigator:
    name: ci (Qt6 build + tests + clang-tidy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Qt6 + assimp
        # The runner's apt mirror has hung this step for 30+ minutes more than
        # once (cancel + rerun fixed it): bound every attempt and retry.
        timeout-minutes: 20
        run: |
          apt_retry() { # bounded attempts: a hung mirror must not eat the job
            for a in 1 2 3; do
              sudo timeout -k 10 300 apt-get -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                -o DPkg::Lock::Timeout=120 "$@" && return 0
              echo "apt-get $1 failed or timed out (attempt $a), retrying"
              # a killed install leaves dpkg interrupted
              sudo dpkg --configure -a || true
              sleep 10
            done
            return 1
          }
          apt_retry update
          # libpulse-dev is optional to the build (find_library, degrades
          # gracefully) but is installed so CI compiles the same audio path a
          # developer machine does, rather than a variant nobody runs.
          apt_retry install -y cmake clang-tidy-18 jq \
            qt6-base-dev qt6-base-dev-tools qt6-serialport-dev \
            libgl1-mesa-dev libassimp-dev libpulse-dev python3-numpy \
            xvfb libgl1-mesa-dri
      - name: Fetch the firmware SITL SDK
        env:
          # The firmware version this GCS is built and tested against. Bumping
          # it is a deliberate, reviewable commit -- which is the point of
          # pinning: a green build here stays green, and a firmware change
          # cannot turn this repo red without someone choosing it.
          #
          # The cost is the mirror of that: drift is not detected until the
          # bump. If the firmware raises VAYU_SITL_ABI_VERSION, nothing here
          # notices until this line moves, and then the module refuses to load
          # and the SITL cases fail loudly -- which is the right place to find
          # out, but not the earliest one.
          VAYU_FW_VERSION: v0.2.1
          # vayu is private: see the header. Read-only, vayu Contents only.
          GH_TOKEN: ${{ secrets.VAYU_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::VAYU_RELEASE_TOKEN is not set, or this run cannot see" \
                 "secrets (a pull request from a fork). vayu is private, so the" \
                 "SITL SDK cannot be fetched without it."
            exit 1
          fi
          ASSET="vayu-sitl-sdk-${VAYU_FW_VERSION}-linux-x86_64.tar.gz"
          gh release download "${VAYU_FW_VERSION}" \
            --repo ragnar-vallhala/vayu --pattern "${ASSET}"
          tar xzf "$ASSET"
          echo "engine build id: $(cat vayu-sitl-sdk/BUILD_ID)"
          # The stamp must be the pinned tag. If it is a bare commit hash the
          # asset came from the rolling release, meaning the pin silently did
          # not take.
          grep -q "^${VAYU_FW_VERSION} " vayu-sitl-sdk/BUILD_ID \
            || { echo "SDK is not ${VAYU_FW_VERSION}"; exit 1; }
          # Named explicitly rather than trusted to a default: if the layout
          # ever changes, fail here with a clear message instead of silently
          # configuring SITL off and losing the coverage this job exists for.
          test -f vayu-sitl-sdk/include/vayu_sitl_abi.h
          test -f vayu-sitl-sdk/lib/libvayu_sitl.so
          test -x vayu-sitl-sdk/bin/vayu_sitl_rtos

      - name: Configure + build
        # Grass/flora is off by default, which leaves GpuGrass.cpp in no
        # database at all; on here so the analysis below sees it.
        run: |
          cmake -S navigator -B navigator/build-tidy \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNAVIGATOR_SIM_GRASS=ON
          cmake --build navigator/build-tidy -j"$(nproc)"
          # The headless mesh tool is the one source neither job's main
          # database reaches; it needs the same Qt6 + assimp already installed
          # here, and a configure is enough.
          cmake -S navigator/headless-sdk/cpp/worldmesh \
                -B navigator/headless-sdk/cpp/worldmesh/build \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Fail if SITL silently turned itself off
        # The CMake gate degrades to a warning when the SDK is missing, which
        # is right for a developer and wrong for this job: a fetch that half
        # worked would leave the simulator sources uncompiled and everything
        # still green. NAVIGATOR_HAS_SITL is the compile definition the app
        # sets only when SITL is really on.
        run: |
          grep -q 'NAVIGATOR_HAS_SITL' navigator/build-tidy/compile_commands.json \
            || { echo "SITL is off -- the SDK was not picked up"; exit 1; }

      - name: ctest
        # 20 QtTest cases. Several construct widgets and so need a platform
        # plugin; offscreen is what the headless render test documents. The
        # module is put beside the test binaries so anything that loads the
        # engine finds it on the first search path.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cp vayu-sitl-sdk/lib/libvayu_sitl.so navigator/build-tidy/
          ctest --test-dir navigator/build-tidy --output-on-failure
      - name: GL context test (xcb on Xvfb, software GL)
        # tst_sim_gl_context needs a real GL platform and skips itself on
        # offscreen, which is what the ctest step above forces on every case --
        # so there ctest only ever reports it Passed having run nothing. Run it
        # here directly: xcb on a virtual X server with GLX, Mesa llvmpipe. It
        # needs only the SDK headers (compile time), not the engine module.
        # A failing binary fails the step; a skip would exit 0, so the totals
        # line is also required to show passes and no skips.
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          t=navigator/build-tidy/tests/tst_sim_gl_context
          test -x "$t" || { echo "$t was not built"; exit 1; }
          xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" "$t" 2>&1 \
            | tee gl-context.log
          grep -qE '^Totals: [1-9][0-9]* passed, 0 failed, 0 skipped' gl-context.log \
            || { echo "::error::tst_sim_gl_context did not pass cleanly (skipped or no passes)"; exit 1; }
      - name: clang-tidy (Navigator)
        # AUTOMOC generates the tst_*.moc the tests include, so this needs a
        # real build, not just a configure. With SITL on, the database covers
        # the simulator sources too -- SimWorker, SitlModule, SimulatorWidget.
        env:
          CLANG_TIDY: clang-tidy-18
        run: |
          tools/dev/run_clang_tidy.sh \
            navigator/build-tidy navigator/headless-sdk/cpp/worldmesh/build

  # The workspace/docking mock (navigator/tools/workspace_mock) and its tests.
  # Own job and own build directory so a problem here cannot turn the main
  # build/clang-tidy job red, and so it needs neither the firmware SDK nor the
  # secret behind it (SITL is off): it runs on fork PRs too.
  #
  # Qt Advanced Docking System is fetched at configure time from a PINNED
  # commit (NAVIGATOR_FETCH_ADS) and built here as a shared library; it needs
  # the Qt private headers, hence qt6-base-private-dev.
  workspace:
    name: Workspace mock + tests (Qt Advanced Docking, Linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Install Qt6 + private headers + Xvfb
        timeout-minutes: 20
        run: |
          apt_retry() { # bounded attempts: a hung mirror must not eat the job
            for a in 1 2 3; do
              sudo timeout -k 10 300 apt-get -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
                -o DPkg::Lock::Timeout=120 "$@" && return 0
              echo "apt-get $1 failed or timed out (attempt $a), retrying"
              # a killed install leaves dpkg interrupted
              sudo dpkg --configure -a || true
              sleep 10
            done
            return 1
          }
          apt_retry update
          apt_retry install -y cmake ninja-build python3-numpy \
            qt6-base-dev qt6-base-private-dev qt6-base-dev-tools \
            qt6-serialport-dev libgl1-mesa-dev libassimp-dev libpulse-dev \
            xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xkb1
      - name: Configure + build the mock and its tests
        run: |
          cmake -S navigator -B navigator/build-ws -G Ninja \
                -DNAVIGATOR_SITL=OFF -DNAVIGATOR_FETCH_ADS=ON \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build navigator/build-ws -j"$(nproc)" \
                --target workspace_mock tst_workspace_manager tst_workspace_gl
      - name: tst_workspace_manager (no GL, offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir navigator/build-ws --output-on-failure -R tst_workspace_manager
      - name: tst_workspace_manager backtrace (only when it failed)
        # The runner's Qt (6.x, newer than a developer machine's) can crash
        # where the local one does not; print where, instead of just SEGFAULT.
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex bt -ex "info threads" \
              --args navigator/build-ws/tests/tst_workspace_manager || true
      - name: tst_workspace_gl (xcb on Xvfb, software GL)
        # The GL test needs a real platform plugin and skips itself under
        # offscreen. It is run as a binary, not through ctest: navigator_test()
        # pins QT_QPA_PLATFORM=offscreen on every ctest case (so this step's
        # xcb was overridden and the test only ever skipped), and ctest hides
        # a QtTest skip as a pass. Run directly, the log shows PASS or SKIP.
        # It was green on two separate GitHub runs (both cases PASS), so a
        # failure or a timeout in any case now fails the job.
        # Run directly (no ctest TIMEOUT), the first run on a runner hung for
        # 30+ minutes, and the next one hung one case for 145 s. Each test
        # function is its own process under its own timeout and xvfb-run, so one
        # hang cannot eat the others. (QTEST_FUNCTION_TIMEOUT is no help: its
        # watchdog calls qFatal and aborts the whole process, so it would end
        # the remaining functions too.) 4 cases x 100 s max < timeout-minutes.
        timeout-minutes: 12
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          bin=navigator/build-ws/tests/tst_workspace_gl
          failed=0
          # The case list comes from the binary, so a new case cannot be left
          # out of CI by forgetting to add it here (the list used to be fixed
          # and two newer cases never ran).
          fns=$(QT_QPA_PLATFORM=offscreen "$bin" -functions | sed 's/()$//')
          n=$(echo "$fns" | grep -c .)
          echo "tst_workspace_gl: $n cases: $(echo $fns)"
          if [ "$n" -lt 4 ]; then
            echo "RESULT: expected at least 4 cases, found $n"; exit 1
          fi
          for fn in $fns; do
            echo "::group::tst_workspace_gl $fn"
            start=$SECONDS
            rc=0
            log=$(mktemp)
            timeout -k 10 100 xvfb-run -a -s "-screen 0 1280x800x24 +extension GLX" \
              "$bin" "$fn" -v2 2>&1 | tee "$log" || true
            rc=${PIPESTATUS[0]}
            secs=$((SECONDS - start))
            echo "::endgroup::"
            case $rc in
              0) res=PASS ;;
              124|137) res=TIMEOUT; failed=1 ;;
              *) res="FAIL(rc=$rc)"; failed=1 ;;
            esac
            # A QtTest skip exits 0 and looks like a pass: require 0 skipped.
            if [ "$res" = PASS ]; then
              totals=$(grep -E '^Totals:' "$log" | tail -1)
              case "$totals" in
                *" 0 skipped"*) ;;
                *) res="SKIPPED-OR-NO-TOTALS ($totals)"; failed=1 ;;
              esac
            fi
            echo "RESULT $fn: $res (${secs}s) ${totals:-}"
          done
          exit $failed

  # The GCS-only Windows build (NAVIGATOR_SITL=OFF: the SITL bridge needs a
  # POSIX host) on MSYS2 UCRT64, the toolchain tools/windows/deploy-navigator-
  # msys.sh bundles from. It keeps the Windows port from rotting between
  # releases; the SITL tabs are compiled out here, everything else is in.
  windows:
    name: Windows build + tests (MSYS2 UCRT64, GCS-only)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-serialport
            git
      - name: Configure + build
        run: |
          cmake -S navigator -B build-win -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DNAVIGATOR_SITL=OFF
          cmake --build build-win -j"$(nproc)"
      - name: ctest
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-win --output-on-failure
      - name: Workspace mock + tests (Qt Advanced Docking)
        # Qt Advanced Docking System is fetched (pinned commit) and built here.
        # Never tried on MSYS2 UCRT64 by the author: it is allowed to fail
        # until someone has seen it pass, and does not gate the check.
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake -S navigator -B build-win-ws -G Ninja \
                -DCMAKE_BUILD_TYPE=Release -DNAVIGATOR_SITL=OFF \
                -DNAVIGATOR_FETCH_ADS=ON
          cmake --build build-win-ws -j"$(nproc)" \
                --target workspace_mock tst_workspace_manager
          ctest --test-dir build-win-ws --output-on-failure -R tst_workspace_manager
      - name: Failing tests, run directly
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # ctest swallowed the QtTest output of a failing test on Windows;
          # run each failed test's exe on its own to see why.
          for t in $(ctest --test-dir build-win --rerun-failed -N | sed -n 's/.*Test *#[0-9]*: //p'); do
            exe=$(find build-win -name "$t.exe" | head -1)
            echo "=== $t ($exe)"
            rc=0
            "$exe" -v2 -o "$t.out.txt,txt" > "$t.stdout.txt" 2>&1 || rc=$?
            echo "exit=$rc"
            cat "$t.out.txt" "$t.stdout.txt" 2>&1 | tail -80
          done

  # The one check branch protection requires: a job that skipped (docs-only
  # change, or commit lint on a push) is ok, anything else that did not
  # succeed fails it.
  ci-required:
    name: CI required
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, commit-lint, navigator, workspace, windows]
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
