name: Qt6 + SITL SDK + ccache build
description: >
  Shared front half of the navigator jobs: install Qt6 and friends, fetch the
  pinned firmware SITL SDK, restore ccache, then configure and build
  navigator/build-tidy. Every job that needs that build tree (ctest, the xcb
  GL tests, clang-tidy) runs this, so each one builds on its own runner and
  the compile is paid once per cache, not once per job. The caller must have
  checked the repo out first.

inputs:
  vayu-token:
    description: Read-only token for the private vayu release (VAYU_RELEASE_TOKEN).
    required: true
  extra-packages:
    description: Extra apt packages for this job only (space separated).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Qt6 + assimp
      # The runner's apt mirror has hung this step for 30+ minutes more than
      # once (cancel + rerun fixed it): bound every attempt and retry.
      shell: bash
      env:
        EXTRA_PACKAGES: ${{ inputs.extra-packages }}
      run: |
        apt_retry() { # bounded attempts: a hung mirror must not eat the job
          for a in 1 2 3; do
            sudo timeout -k 10 300 apt-get -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 \
              -o DPkg::Lock::Timeout=120 "$@" && return 0
            echo "apt-get $1 failed or timed out (attempt $a), retrying"
            # a killed install leaves dpkg interrupted
            sudo dpkg --configure -a || true
            # the runner could not resolve the default Ubuntu mirror
            # hostnames (DNS): retry through a different mirror
            sudo sed -i -E 's#(mirror\+file:/etc/apt/apt-mirrors\.txt|https?://(azure\.archive|security|archive)\.ubuntu\.com/ubuntu/?)#http://mirrors.edge.kernel.org/ubuntu/#g' \
              /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list \
              /etc/apt/sources.list 2>/dev/null || true
            sleep 10
          done
          return 1
        }
        apt_retry update
        # libpulse-dev is optional to the build (find_library, degrades
        # gracefully) but is installed so CI compiles the same audio path a
        # developer machine does, rather than a variant nobody runs.
        # shellcheck disable=SC2086 -- EXTRA_PACKAGES is a deliberate word list
        apt_retry install -y cmake ccache \
          qt6-base-dev qt6-base-private-dev qt6-base-dev-tools qt6-serialport-dev \
          libgl1-mesa-dev libassimp-dev libpulse-dev \
          xvfb libgl1-mesa-dri libxkbcommon-x11-0 libxcb-icccm4 \
          libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
          libxcb-xkb1 $EXTRA_PACKAGES

    - name: Fetch the firmware SITL SDK
      shell: bash
      env:
        # The firmware version this GCS is built and tested against. Bumping
        # it is a deliberate, reviewable commit -- which is the point of
        # pinning: a green build here stays green, and a firmware change
        # cannot turn this repo red without someone choosing it.
        #
        # The cost is the mirror of that: drift is not detected until the
        # bump. If the firmware raises VAYU_SITL_ABI_VERSION, nothing here
        # notices until this line moves, and then the module refuses to load
        # and the SITL cases fail loudly -- which is the right place to find
        # out, but not the earliest one.
        VAYU_FW_VERSION: v0.2.1
        # vayu is private: see the header of ci.yml. Read-only, vayu Contents only.
        GH_TOKEN: ${{ inputs.vayu-token }}
      run: |
        set -euo pipefail
        if [ -z "${GH_TOKEN}" ]; then
          echo "::error::VAYU_RELEASE_TOKEN is not set, or this run cannot see" \
               "secrets (a pull request from a fork). vayu is private, so the" \
               "SITL SDK cannot be fetched without it."
          exit 1
        fi
        ASSET="vayu-sitl-sdk-${VAYU_FW_VERSION}-linux-x86_64.tar.gz"
        gh release download "${VAYU_FW_VERSION}" \
          --repo ragnar-vallhala/vayu --pattern "${ASSET}"
        tar xzf "$ASSET"
        echo "engine build id: $(cat vayu-sitl-sdk/BUILD_ID)"
        # The stamp must be the pinned tag. If it is a bare commit hash the
        # asset came from the rolling release, meaning the pin silently did
        # not take.
        grep -q "^${VAYU_FW_VERSION} " vayu-sitl-sdk/BUILD_ID \
          || { echo "SDK is not ${VAYU_FW_VERSION}"; exit 1; }
        # Named explicitly rather than trusted to a default: if the layout
        # ever changes, fail here with a clear message instead of silently
        # configuring SITL off and losing the coverage the jobs exist for.
        test -f vayu-sitl-sdk/include/vayu_sitl_abi.h
        test -f vayu-sitl-sdk/lib/libvayu_sitl.so
        test -x vayu-sitl-sdk/bin/vayu_sitl_rtos

    - name: Restore ccache
      # One cache per job id: the jobs compile the same tree, but a shared key
      # would have the first to finish win the save and the others fail to
      # reserve it. A PR falls back to the newest cache of the same job from
      # its own ref or the base branch (restore-keys), so a first PR run after
      # a push to main is warm rather than cold.
      uses: actions/cache@v5
      with:
        path: ~/.cache/ccache
        key: ccache-qt6-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          ccache-qt6-${{ github.job }}-

    - name: Configure + build
      # Grass/flora is off by default, which leaves GpuGrass.cpp in no
      # database at all; on here so the analysis sees it.
      shell: bash
      env:
        CCACHE_BASEDIR: ${{ github.workspace }}
        CCACHE_MAXSIZE: 600M
      run: |
        export CCACHE_DIR="$HOME/.cache/ccache"
        ccache --zero-stats
        cmake -S navigator -B navigator/build-tidy \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DNAVIGATOR_SIM_GRASS=ON \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        cmake --build navigator/build-tidy -j"$(nproc)"
        ccache --show-stats

    - name: Fail if SITL silently turned itself off
      # The CMake gate degrades to a warning when the SDK is missing, which
      # is right for a developer and wrong for CI: a fetch that half worked
      # would leave the simulator sources uncompiled and everything still
      # green. NAVIGATOR_HAS_SITL is the compile definition the app sets only
      # when SITL is really on.
      shell: bash
      run: |
        grep -q 'NAVIGATOR_HAS_SITL' navigator/build-tidy/compile_commands.json \
          || { echo "SITL is off -- the SDK was not picked up"; exit 1; }
